# Nasazení webu na ursus.skauting.cz (LebedaHosting) přes FTP.
#
# Spouští se automaticky po každém pushi/mergi do main (ostré nasazení do www/).
# Ručně: GitHub → Actions → „Nasadit na ursus.skauting.cz“ → Run workflow
# (výchozí je zkušební běh, který jen vypíše, co by nahrál).
#
# Potřebuje secret FTP_PASSWORD (heslo FTP uživatele „ursus“ z administrace LebedaHostingu):
# GitHub → Settings → Secrets and variables → Actions → New repository secret.

name: Nasadit na ursus.skauting.cz

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Zkušební běh – nic nenahrávat, jen vypsat změny'
        type: boolean
        default: true
      php_errors:
        description: 'Vypsat poslední chyby PHP z logu serveru (bez IP adres)'
        type: boolean
        default: false
      server_dir:
        description: 'Složka webu na FTP serveru (musí končit lomítkem)'
        type: string
        default: 'www/'
  push:
    branches: ['main']

concurrency:
  group: deploy-lebeda
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build
        env:
          # Ostrá doména: indexovat, canonical a sitemap na ursus.skauting.cz
          NEXT_PUBLIC_SITE_URL: https://ursus.skauting.cz

      - name: Výpis složky na FTP serveru (jen při zkušebním běhu)
        if: ${{ inputs.dry_run }}
        continue-on-error: true
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SERVER_DIR: ${{ inputs.server_dir || 'www/' }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          lftp -u "ursus,$FTP_PASSWORD" -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:max-retries 1; cd '$SERVER_DIR'; pwd; cls -la --sort=name; bye" lebedahosting.cz

      - name: Poslední chyby PHP ze serveru
        if: ${{ inputs.php_errors }}
        continue-on-error: true
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          command -v lftp > /dev/null || sudo apt-get install -y -qq lftp > /dev/null
          lftp -u "ursus,$FTP_PASSWORD" -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; cat __log/error.log; bye" lebedahosting.cz \
            | grep -iE "php (fatal|parse|warning)|uncaught" \
            | sed -E 's/\[client [^]]*\]//g; s/, referer: .*$//' \
            | tail -n 25

      # lftp místo FTP-Deploy-Action: server vyžaduje znovupoužití TLS session
      # na datovém spojení, což knihovna basic-ftp neumí (ECONNRESET).
      # Bez --delete: na serveru se nic nemaže (zůstanou dokumenty/, fotky, WordPress).
      # Kvůli tomu, aby návštěvník během nasazení nedostal rozbitou (bílou) stránku:
      #  - soubory se nahrávají pod dočasným jménem a pak se přejmenují (xfer:use-temp-file),
      #  - nejdřív se nahrají obrázky, CSS a JS, až potom HTML, index.php a .htaccess.
      - name: Nahrát přes FTP
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SERVER_DIR: ${{ inputs.server_dir || 'www/' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          command -v lftp > /dev/null || sudo apt-get install -y -qq lftp > /dev/null
          SETTINGS="set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:max-retries 3; set net:timeout 30; set net:reconnect-interval-base 5; set xfer:use-temp-file true"
          PAGES_OUT="-X *.html -X *.txt -X index.php -X .htaccess"
          PAGES_IN="-I *.html -I *.txt -I index.php -I .htaccess"
          lftp -u "ursus,$FTP_PASSWORD" -e "$SETTINGS; mirror --reverse --verbose --no-perms --parallel=3 $DRY_RUN $PAGES_OUT out/ '$SERVER_DIR'; mirror --reverse --verbose --no-perms --parallel=3 $DRY_RUN $PAGES_IN out/ '$SERVER_DIR'; bye" lebedahosting.cz
